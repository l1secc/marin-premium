# ============================================================================
#  Marin Kitagawa — "Marin Premium"  ·  Omarchy Dark Mode
#  Professional anime aesthetic · low eye-strain · high contrast
#
#  Color inspiration drawn from Marin Kitagawa's character design
#  (My Dress-Up Darling / Sono Bisque Doll wa Koi wo Suru):
#    · honey-blonde hair       →  #e8c98f
#    · rose-pink eyes & blush  →  #f2a3c0
#    · lilac accessories       →  #bba7e6
#    · deep navy uniform       →  #0f1522
#
#  Tuned for long sessions: every foreground sits at >= 7:1 contrast on
#  the deepest background surface, no full-saturation hues, all accents
#  pulled toward warm/dusty to avoid LED glare.
# ============================================================================

mode = "dark"

# ---------------------------------------------------------------------------
#  THEME  ·  core surface + accent tokens
# ---------------------------------------------------------------------------

# Deep school-uniform navy (background family)
background         = "#0f1522"   # uniform navy — base canvas
darker_background  = "#0a0e18"   # pre-surface, dimmest depth
dark_background    = "#141c2e"   # elevated surface (cards, popups)
lighter_background = "#1b2540"   # hover / focused surface
background_alt     = "#0c111c"   # alt accent surface
background_surface = "#182237"   # mid-elevated surface (popups, tooltips)

# Text — cool, paper-white. Bright_foreground is reserved for selected/highlighted.
foreground         = "#d9dfee"
bright_foreground  = "#eef2fb"
light_foreground   = "#c3cbdf"
dark_foreground    = "#6d7890"
muted              = "#5a6580"

# Accents  ·  Marin pink / blonde gold / lilac
accent      = "#f2a3c0"   # Marin pink — eyes + makeup (primary accent)
primary     = "#e8c98f"   # blonde gold — hair (titles, focused states)
secondary   = "#bba7e6"   # lilac — accessories (links, info chips)

# Selection + cursor
selection            = "#2b3754"   # navy-violet selection highlight
selection_background = "#2b3754"
selection_foreground = "#eef2fb"
cursor               = "#eef2fb"

# Hyprland active-border: 3-stop diagonal gradient
# pink → lilac → gold (45deg)  — flows through Marin's full palette
hyprland_active_border   = "rgba(f2a3c0ee) rgba(bba7e6ee) rgba(e8c98fee) 45deg"
hyprland_inactive_border = "rgba(5a6580aa)"

# ---------------------------------------------------------------------------
#  COLORS  ·  semantic palette (syntax-highlight friendly)
# ---------------------------------------------------------------------------

red     = "#e06c8a"   # rose red — errors, stays legible on navy
yellow  = "#e8c98f"   # blonde gold
orange  = "#eab384"   # soft apricot
green   = "#a3cdb0"   # sage mint — comments/strings read cleanly
cyan    = "#9ad0d8"   # soft aqua
blue    = "#8fb2e8"   # periwinkle
magenta = "#f2a3c0"   # Marin pink
brown   = "#a07a58"

bright_red     = "#f0a5b8"
bright_yellow  = "#f2d8a8"
bright_green   = "#c4e1ce"
bright_cyan    = "#bde4e6"
bright_blue    = "#b6c8f0"
bright_magenta = "#f7c2d9"

# ---------------------------------------------------------------------------
#  ANSI 0-15  ·  terminal color matrix
#  Tuned for: foreground contrast >= 5.5:1 on background (#0f1522)
#  All hues desaturated ~10–15% to soften prolonged-exposure eye strain.
# ---------------------------------------------------------------------------

color0  = "#0f1522"   # background
color1  = "#e06c8a"   # rose red
color2  = "#a3cdb0"   # sage green
color3  = "#e8c98f"   # blonde gold
color4  = "#8fb2e8"   # periwinkle
color5  = "#f2a3c0"   # Marin pink
color6  = "#9ad0d8"   # aqua
color7  = "#d9dfee"   # foreground

color8  = "#5a6580"   # muted (comments/dim)
color9  = "#f0a5b8"   # bright rose
color10 = "#c4e1ce"   # bright sage
color11 = "#f2d8a8"   # bright gold
color12 = "#b6c8f0"   # bright periwinkle
color13 = "#f7c2d9"   # bright pink
color14 = "#bde4e6"   # bright aqua
color15 = "#eef2fb"   # bright foreground (cursor / selected text)