[bar]
background       = "#2b2815"
background-alpha = 0.88
text             = "#e1e0db"
active           = "#f1ea9b"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(f1ea9bee) rgba(dbeea2ee) rgba(eec6a2ee) 45deg"
active-border-foreground = "#f1ea9b"

[controls]
normal-color        = "#d1cfc2"
normal-fill-alpha   = 0.05
normal-border       = "#d1cfc2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f3f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#f1ea9b"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#f1ea9b"
focus-fill-alpha   = 0.12
focus-border       = "#f1ea9b"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#eec6a2"
selected-fill-alpha   = 0.18
selected-border       = "#eec6a2"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#38331a"
background-alpha = 0.92
text             = "#e1e0db"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#38331a"
background-alpha = 0.92
text             = "#f3f3f2"
border           = "#f1ea9b"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#38331a"
background-alpha = 0.92
text             = "#e1e0db"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#f1ea9b"

[launcher]
background                = "#2b2815"
background-alpha          = 0.95
text                      = "#f3f3f2"
border                    = "#f1ea9b"
border-alpha              = 1.0
scrim                     = "#2b2815"
scrim-alpha               = 0.55
selected-background       = "#66623d"
selected-background-alpha = 0.30
selected-text             = "#f4c3c2"
selected-border           = "#f1ea9b"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#2b2815"
background-alpha          = 0.95
text                      = "#f3f3f2"
border                    = "#f1ea9b"
border-alpha              = 1.0
scrim                     = "#2b2815"
scrim-alpha               = 0.55
selected-background       = "#66623d"
selected-background-alpha = 0.30
selected-text             = "#f4c3c2"
selected-border           = "#f1ea9b"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#2b2815"
background-alpha = 0.95
text             = "#e1e0db"
text-error       = "#de7566"
border           = "hyprland.active-border"
border-error     = "#de7566"
border-alpha     = 1.0
border-width     = 2
scrim            = "#2b2815"
scrim-alpha      = 0.5
accent           = "#f1ea9b"

[lock]
background       = "#2b2815"
background-alpha = 0.80
text             = "#e1e0db"
placeholder      = "#a19b78"
text-error       = "#de7566"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#de7566"
border-alpha     = 1.0
border-width     = 2
selection        = "#f1ea9b"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#2b2815"
scrim-alpha             = "0.5"
text                    = "#e1e0db"
selected-border         = "#f1ea9b"
selected-border-alpha   = 1.0
unselected-border       = "#d1cfc2"
unselected-border-alpha = 0.28