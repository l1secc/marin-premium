[bar]
background       = "#271927"
background-alpha = 0.88
text             = "#e1dbe1"
active           = "#a9cef4"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(a9cef4ee) rgba(b0bbf1ee) rgba(f6aeacee) 45deg"
active-border-foreground = "#a9cef4"

[controls]
normal-color        = "#d1c2d1"
normal-fill-alpha   = 0.05
normal-border       = "#d1c2d1"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f3"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#a9cef4"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#a9cef4"
focus-fill-alpha   = 0.12
focus-border       = "#a9cef4"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#f6aeac"
selected-fill-alpha   = 0.18
selected-border       = "#f6aeac"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#322032"
background-alpha = 0.92
text             = "#e1dbe1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#322032"
background-alpha = 0.92
text             = "#f3f2f3"
border           = "#a9cef4"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#322032"
background-alpha = 0.92
text             = "#e1dbe1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#a9cef4"

[launcher]
background                = "#271927"
background-alpha          = 0.95
text                      = "#f3f2f3"
border                    = "#a9cef4"
border-alpha              = 1.0
scrim                     = "#271927"
scrim-alpha               = 0.55
selected-background       = "#4e4f64"
selected-background-alpha = 0.30
selected-text             = "#f4c3d0"
selected-border           = "#a9cef4"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#271927"
background-alpha          = 0.95
text                      = "#f3f2f3"
border                    = "#a9cef4"
border-alpha              = 1.0
scrim                     = "#271927"
scrim-alpha               = 0.55
selected-background       = "#4e4f64"
selected-background-alpha = 0.30
selected-text             = "#f4c3d0"
selected-border           = "#a9cef4"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#271927"
background-alpha = 0.95
text             = "#e1dbe1"
text-error       = "#db687b"
border           = "hyprland.active-border"
border-error     = "#db687b"
border-alpha     = 1.0
