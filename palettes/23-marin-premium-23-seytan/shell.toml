[bar]
background       = "#24141a"
background-alpha = 0.88
text             = "#e1dbdd"
active           = "#e0b4cb"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(e0b4cbee) rgba(e2b7c0ee) rgba(8f6cc3ee) 45deg"
active-border-foreground = "#e0b4cb"

[controls]
normal-color        = "#d1c2c7"
normal-fill-alpha   = 0.05
normal-border       = "#d1c2c7"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#e0b4cb"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#e0b4cb"
focus-fill-alpha   = 0.12
focus-border       = "#e0b4cb"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#8f6cc3"
selected-fill-alpha   = 0.18
selected-border       = "#8f6cc3"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#301a22"
background-alpha = 0.92
text             = "#e1dbdd"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#301a22"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#e0b4cb"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#301a22"
background-alpha = 0.92
text             = "#e1dbdd"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#e0b4cb"

[launcher]
background                = "#24141a"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#e0b4cb"
border-alpha              = 1.0
scrim                     = "#24141a"
scrim-alpha               = 0.55
selected-background       = "#5c444f"
selected-background-alpha = 0.30
selected-text             = "#eec8da"
selected-border           = "#e0b4cb"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#24141a"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#e0b4cb"
border-alpha              = 1.0
scrim                     = "#24141a"
scrim-alpha               = 0.55
selected-background       = "#5c444f"
selected-background-alpha = 0.30
selected-text             = "#eec8da"
selected-border           = "#e0b4cb"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#24141a"
background-alpha = 0.95
text             = "#e1dbdd"
text-error       = "#cc7084"
border           = "hyprland.active-border"
border-error     = "#cc7084"
border-alpha     = 1.0
border-width     = 2
scrim            = "#24141a"
scrim-alpha      = 0.5
accent           = "#e0b4cb"

[lock]
background       = "#24141a"
background-alpha = 0.80
text             = "#e1dbdd"
placeholder      = "#a17886"
text-error       = "#cc7084"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
