border-alpha     = 1.0
border-width     = 2
selection        = "#e0b4cb"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#24141a"
scrim-alpha             = "0.5"
text                    = "#e1dbdd"
selected-border         = "#e0b4cb"
selected-border-alpha   = 1.0
unselected-border       = "#d1c2c7"
unselected-border-alpha = 0.28