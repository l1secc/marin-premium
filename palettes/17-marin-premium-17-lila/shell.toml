[bar]
background       = "#27161d"
background-alpha = 0.88
text             = "#e1dbdd"
active           = "#d589bf"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(d589bfee) rgba(d48fa9ee) rgba(f4c49cee) 45deg"
active-border-foreground = "#d589bf"

[controls]
normal-color        = "#d1c2c8"
normal-fill-alpha   = 0.05
normal-border       = "#d1c2c8"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#d589bf"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#d589bf"
focus-fill-alpha   = 0.12
focus-border       = "#d589bf"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#f4c49c"
selected-fill-alpha   = 0.18
selected-border       = "#f4c49c"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#331c25"
background-alpha = 0.92
text             = "#e1dbdd"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#331c25"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#d589bf"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#331c25"
background-alpha = 0.92
text             = "#e1dbdd"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#d589bf"

[launcher]
background                = "#27161d"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#d589bf"
border-alpha              = 1.0
scrim                     = "#27161d"
scrim-alpha               = 0.55
selected-background       = "#5b384e"
selected-background-alpha = 0.30
selected-text             = "#f3c4d7"
selected-border           = "#d589bf"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#27161d"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#d589bf"
border-alpha              = 1.0
scrim                     = "#27161d"
scrim-alpha               = 0.55
selected-background       = "#5b384e"
selected-background-alpha = 0.30
selected-text             = "#f3c4d7"
selected-border           = "#d589bf"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#27161d"
background-alpha = 0.95
text             = "#e1dbdd"
text-error       = "#d8647f"
border           = "hyprland.active-border"
border-error     = "#d8647f"
border-alpha     = 1.0
border-width     = 2
scrim            = "#27161d"
scrim-alpha      = 0.5
accent           = "#d589bf"

[lock]
background       = "#27161d"
background-alpha = 0.80
text             = "#e1dbdd"
placeholder      = "#a17888"
text-error       = "#d8647f"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d8647f"
border-alpha     = 1.0
border-width     = 2
selection        = "#d589bf"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#27161d"
scrim-alpha             = "0.5"
text                    = "#e1dbdd"
selected-border         = "#d589bf"
selected-border-alpha   = 1.0
unselected-border       = "#d1c2c8"
unselected-border-alpha = 0.28