[bar]
background       = "#271917"
background-alpha = 0.88
text             = "#e1dbdb"
active           = "#e0bfb1"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(e0bfb1ee) rgba(e1b4bbee) rgba(e1d1b4ee) 45deg"
active-border-foreground = "#e0bfb1"

[controls]
normal-color        = "#d1c4c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c4c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#e0bfb1"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#e0bfb1"
focus-fill-alpha   = 0.12
focus-border       = "#e0bfb1"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#e1d1b4"
selected-fill-alpha   = 0.18
selected-border       = "#e1d1b4"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#32201e"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#32201e"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#e0bfb1"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#32201e"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#e0bfb1"

[launcher]
background                = "#271917"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#e0bfb1"
border-alpha              = 1.0
scrim                     = "#271917"
scrim-alpha               = 0.55
selected-background       = "#5e4b45"
selected-background-alpha = 0.30
selected-text             = "#efc7d2"
selected-border           = "#e0bfb1"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#271917"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#e0bfb1"
border-alpha              = 1.0
scrim                     = "#271917"
scrim-alpha               = 0.55
selected-background       = "#5e4b45"
selected-background-alpha = 0.30
selected-text             = "#efc7d2"
selected-border           = "#e0bfb1"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#271917"
background-alpha = 0.95
text             = "#e1dbdb"
text-error       = "#cf6d7f"
border           = "hyprland.active-border"
border-error     = "#cf6d7f"
border-alpha     = 1.0
border-width     = 2
scrim            = "#271917"
scrim-alpha      = 0.5
accent           = "#e0bfb1"

[lock]
background       = "#271917"
background-alpha = 0.80
text             = "#e1dbdb"
placeholder      = "#a17c78"
text-error       = "#cf6d7f"
border           = "hyprland.active-border"
