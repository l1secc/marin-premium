[bar]
background       = "#24171b"
background-alpha = 0.88
text             = "#e1dbdd"
active           = "#eabf9d"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(eabf9dee) rgba(c46d7dee) rgba(bc5ca2ee) 45deg"
active-border-foreground = "#eabf9d"

[controls]
normal-color        = "#d1c2c6"
normal-fill-alpha   = 0.05
normal-border       = "#d1c2c6"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#eabf9d"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#eabf9d"
focus-fill-alpha   = 0.12
focus-border       = "#eabf9d"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#bc5ca2"
selected-fill-alpha   = 0.18
selected-border       = "#bc5ca2"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#301d23"
background-alpha = 0.92
text             = "#e1dbdd"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#301d23"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#eabf9d"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#301d23"
background-alpha = 0.92
text             = "#e1dbdd"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#eabf9d"

[launcher]
background                = "#24171b"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#eabf9d"
border-alpha              = 1.0
scrim                     = "#24171b"
scrim-alpha               = 0.55
selected-background       = "#5f4942"
selected-background-alpha = 0.30
selected-text             = "#efc7d3"
selected-border           = "#eabf9d"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#24171b"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#eabf9d"
border-alpha              = 1.0
scrim                     = "#24171b"
scrim-alpha               = 0.55
selected-background       = "#5f4942"
selected-background-alpha = 0.30
selected-text             = "#efc7d3"
selected-border           = "#eabf9d"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#24171b"
background-alpha = 0.95
text             = "#e1dbdd"
text-error       = "#cf6e81"
border           = "hyprland.active-border"
border-error     = "#cf6e81"
border-alpha     = 1.0
border-width     = 2
scrim            = "#24171b"
scrim-alpha      = 0.5
accent           = "#eabf9d"

[lock]
background       = "#24171b"
background-alpha = 0.80
text             = "#e1dbdd"
placeholder      = "#a17884"
text-error       = "#cf6e81"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#cf6e81"
border-alpha     = 1.0
border-width     = 2
selection        = "#eabf9d"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#24171b"
scrim-alpha             = "0.5"
text                    = "#e1dbdd"
selected-border         = "#eabf9d"
selected-border-alpha   = 1.0
unselected-border       = "#d1c2c6"
unselected-border-alpha = 0.28