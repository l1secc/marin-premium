[bar]
background       = "#261d19"
background-alpha = 0.88
text             = "#e1dddb"
active           = "#dcae94"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(dcae94ee) rgba(a6cadcee) rgba(dac69aee) 45deg"
active-border-foreground = "#dcae94"

[controls]
normal-color        = "#d1c7c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c7c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#dcae94"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#dcae94"
focus-fill-alpha   = 0.12
focus-border       = "#dcae94"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#dac69a"
selected-fill-alpha   = 0.18
selected-border       = "#dac69a"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#31261f"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#31261f"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#dcae94"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#31261f"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#dcae94"

[launcher]
background                = "#261d19"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#dcae94"
border-alpha              = 1.0
scrim                     = "#261d19"
