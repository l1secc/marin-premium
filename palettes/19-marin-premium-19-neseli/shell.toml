[bar]
background       = "#131326"
background-alpha = 0.88
text             = "#dbdbe1"
active           = "#7375d1"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(7375d1ee) rgba(d496ccee) rgba(e3b4bbee) 45deg"
active-border-foreground = "#7375d1"

[controls]
normal-color        = "#c2c2d1"
normal-fill-alpha   = 0.05
normal-border       = "#c2c2d1"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f2f2f3"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#7375d1"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#7375d1"
focus-fill-alpha   = 0.12
focus-border       = "#7375d1"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#e3b4bb"
selected-fill-alpha   = 0.18
selected-border       = "#e3b4bb"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#181932"
background-alpha = 0.92
text             = "#dbdbe1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#181932"
background-alpha = 0.92
text             = "#f2f2f3"
border           = "#7375d1"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#181932"
background-alpha = 0.92
text             = "#dbdbe1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#7375d1"

[launcher]
background                = "#131326"
background-alpha          = 0.95
text                      = "#f2f2f3"
border                    = "#7375d1"
border-alpha              = 1.0
scrim                     = "#131326"
scrim-alpha               = 0.55
selected-background       = "#303059"
selected-background-alpha = 0.30
selected-text             = "#f0c6d2"
selected-border           = "#7375d1"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
