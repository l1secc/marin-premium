[bar]
background       = "#281d17"
background-alpha = 0.88
text             = "#e1dddb"
active           = "#f2c68a"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(f2c68aee) rgba(9fc3d8ee) rgba(efe692ee) 45deg"
active-border-foreground = "#f2c68a"

[controls]
normal-color        = "#d1c7c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c7c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#f2c68a"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#f2c68a"
focus-fill-alpha   = 0.12
focus-border       = "#f2c68a"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#efe692"
selected-fill-alpha   = 0.18
selected-border       = "#efe692"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#33251d"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#33251d"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#f2c68a"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#33251d"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#f2c68a"

[launcher]
background                = "#281d17"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f2c68a"
border-alpha              = 1.0
scrim                     = "#281d17"
scrim-alpha               = 0.55
selected-background       = "#65503a"
selected-background-alpha = 0.30
selected-text             = "#f2c5c8"
selected-border           = "#f2c68a"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#281d17"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f2c68a"
border-alpha              = 1.0
scrim                     = "#281d17"
scrim-alpha               = 0.55
selected-background       = "#65503a"
selected-background-alpha = 0.30
selected-text             = "#f2c5c8"
selected-border           = "#f2c68a"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#281d17"
background-alpha = 0.95
text             = "#e1dddb"
text-error       = "#d7716d"
border           = "hyprland.active-border"
border-error     = "#d7716d"
border-alpha     = 1.0
border-width     = 2
scrim            = "#281d17"
scrim-alpha      = 0.5
accent           = "#f2c68a"

[lock]
background       = "#281d17"
background-alpha = 0.80
text             = "#e1dddb"
placeholder      = "#a18778"
text-error       = "#d7716d"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#d7716d"
border-alpha     = 1.0
border-width     = 2
selection        = "#f2c68a"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#281d17"
scrim-alpha             = "0.5"
text                    = "#e1dddb"
selected-border         = "#f2c68a"
selected-border-alpha   = 1.0
unselected-border       = "#d1c7c2"
unselected-border-alpha = 0.28