[bar]
background       = "#211419"
background-alpha = 0.88
text             = "#e1dbdd"
active           = "#dda4a7"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(dda4a7ee) rgba(dca9c3ee) rgba(dcb7a9ee) 45deg"
active-border-foreground = "#dda4a7"

[controls]
normal-color        = "#d1c2c7"
normal-fill-alpha   = 0.05
normal-border       = "#d1c2c7"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#dda4a7"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#dda4a7"
focus-fill-alpha   = 0.12
focus-border       = "#dda4a7"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#dcb7a9"
selected-fill-alpha   = 0.18
selected-border       = "#dcb7a9"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#2d1a21"
background-alpha = 0.92
text             = "#e1dbdd"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#2d1a21"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#dda4a7"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#2d1a21"
background-alpha = 0.92
text             = "#e1dbdd"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#dda4a7"

[launcher]
background                = "#211419"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#dda4a7"
border-alpha              = 1.0
scrim                     = "#211419"
scrim-alpha               = 0.55
selected-background       = "#593f44"
selected-background-alpha = 0.30
selected-text             = "#f0c7da"
selected-border           = "#dda4a7"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#211419"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#dda4a7"
border-alpha              = 1.0
scrim                     = "#211419"
scrim-alpha               = 0.55
selected-background       = "#593f44"
selected-background-alpha = 0.30
selected-text             = "#f0c7da"
selected-border           = "#dda4a7"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#211419"
background-alpha = 0.95
text             = "#e1dbdd"
text-error       = "#cf6d7b"
border           = "hyprland.active-border"
border-error     = "#cf6d7b"
border-alpha     = 1.0
border-width     = 2
