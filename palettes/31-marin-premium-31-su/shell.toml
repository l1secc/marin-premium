[bar]
background       = "#271b19"
background-alpha = 0.88
text             = "#e1dbdb"
active           = "#f5afa3"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(f5afa3ee) rgba(9fd3ddee) rgba(ead298ee) 45deg"
active-border-foreground = "#f5afa3"

[controls]
normal-color        = "#d1c4c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c4c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#f5afa3"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#f5afa3"
focus-fill-alpha   = 0.12
focus-border       = "#f5afa3"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#ead298"
selected-fill-alpha   = 0.18
selected-border       = "#ead298"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#322220"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#322220"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#f5afa3"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#322220"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#f5afa3"

[launcher]
background                = "#271b19"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f5afa3"
border-alpha              = 1.0
scrim                     = "#271b19"
scrim-alpha               = 0.55
selected-background       = "#654742"
selected-background-alpha = 0.30
selected-text             = "#f4c3cb"
selected-border           = "#f5afa3"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#271b19"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f5afa3"
border-alpha              = 1.0
scrim                     = "#271b19"
scrim-alpha               = 0.55
selected-background       = "#654742"
selected-background-alpha = 0.30
selected-text             = "#f4c3cb"
selected-border           = "#f5afa3"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#271b19"
background-alpha = 0.95
text             = "#e1dbdb"
text-error       = "#dd676f"
border           = "hyprland.active-border"
border-error     = "#dd676f"
border-alpha     = 1.0
border-width     = 2
scrim            = "#271b19"
scrim-alpha      = 0.5
accent           = "#f5afa3"

[lock]
