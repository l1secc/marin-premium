[bar]
background       = "#171d26"
background-alpha = 0.88
text             = "#dbdde1"
active           = "#72b5ef"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(72b5efee) rgba(7b92ebee) rgba(d5a996ee) 45deg"
active-border-foreground = "#72b5ef"

[controls]
normal-color        = "#c2c8d1"
normal-fill-alpha   = 0.05
normal-border       = "#c2c8d1"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f2f2f3"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#72b5ef"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#72b5ef"
focus-fill-alpha   = 0.12
focus-border       = "#72b5ef"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#d5a996"
selected-fill-alpha   = 0.18
selected-border       = "#d5a996"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#1d2532"
background-alpha = 0.92
text             = "#dbdde1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#1d2532"
background-alpha = 0.92
text             = "#f2f2f3"
border           = "#72b5ef"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#1d2532"
background-alpha = 0.92
text             = "#dbdde1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#72b5ef"

[launcher]
background                = "#171d26"
background-alpha          = 0.95
text                      = "#f2f2f3"
border                    = "#72b5ef"
border-alpha              = 1.0
scrim                     = "#171d26"
scrim-alpha               = 0.55
selected-background       = "#324b62"
selected-background-alpha = 0.30
selected-text             = "#f4c3c6"
selected-border           = "#72b5ef"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#171d26"
background-alpha          = 0.95
text                      = "#f2f2f3"
border                    = "#72b5ef"
border-alpha              = 1.0
scrim                     = "#171d26"
scrim-alpha               = 0.55
selected-background       = "#324b62"
selected-background-alpha = 0.30
selected-text             = "#f4c3c6"
selected-border           = "#72b5ef"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#171d26"
background-alpha = 0.95
text             = "#dbdde1"
text-error       = "#db6661"
border           = "hyprland.active-border"
border-error     = "#db6661"
border-alpha     = 1.0
border-width     = 2
scrim            = "#171d26"
scrim-alpha      = 0.5
accent           = "#72b5ef"

[lock]
background       = "#171d26"
background-alpha = 0.80
text             = "#dbdde1"
placeholder      = "#7888a1"
text-error       = "#db6661"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
