[image-picker]
scrim                   = "#171d26"
scrim-alpha             = "0.5"
text                    = "#dbdde1"
selected-border         = "#72b5ef"
selected-border-alpha   = 1.0
unselected-border       = "#c2c8d1"
unselected-border-alpha = 0.28