[bar]
background       = "#211514"
background-alpha = 0.88
text             = "#e1dbdb"
active           = "#eaa36d"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(eaa36dee) rgba(e57678ee) rgba(e5cb76ee) 45deg"
active-border-foreground = "#eaa36d"

[controls]
normal-color        = "#d1c3c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c3c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#eaa36d"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#eaa36d"
focus-fill-alpha   = 0.12
focus-border       = "#eaa36d"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#e5cb76"
selected-fill-alpha   = 0.18
selected-border       = "#e5cb76"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#2c1c1b"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#2c1c1b"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#eaa36d"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#2c1c1b"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#eaa36d"

[launcher]
background                = "#211514"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#eaa36d"
border-alpha              = 1.0
scrim                     = "#211514"
scrim-alpha               = 0.55
selected-background       = "#5d402f"
selected-background-alpha = 0.30
selected-text             = "#f1c5cf"
selected-border           = "#eaa36d"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#211514"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#eaa36d"
border-alpha              = 1.0
scrim                     = "#211514"
