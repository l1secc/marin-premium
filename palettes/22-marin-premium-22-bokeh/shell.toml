[bar]
background       = "#291b15"
background-alpha = 0.88
text             = "#e1dddb"
active           = "#f3c68f"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(f3c68fee) rgba(efa097ee) rgba(efe597ee) 45deg"
active-border-foreground = "#f3c68f"

[controls]
normal-color        = "#d1c7c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c7c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#f3c68f"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#f3c68f"
focus-fill-alpha   = 0.12
focus-border       = "#f3c68f"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#efe597"
selected-fill-alpha   = 0.18
selected-border       = "#efe597"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#35231a"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#35231a"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#f3c68f"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#35231a"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#f3c68f"

[launcher]
background                = "#291b15"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f3c68f"
border-alpha              = 1.0
scrim                     = "#291b15"
scrim-alpha               = 0.55
selected-background       = "#664e3a"
selected-background-alpha = 0.30
selected-text             = "#f3c4cb"
selected-border           = "#f3c68f"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#291b15"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f3c68f"
border-alpha              = 1.0
scrim                     = "#291b15"
scrim-alpha               = 0.55
selected-background       = "#664e3a"
selected-background-alpha = 0.30
selected-text             = "#f3c4cb"
selected-border           = "#f3c68f"
selected-border-alpha     = 0.94
