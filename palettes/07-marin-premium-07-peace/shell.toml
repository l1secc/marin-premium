[bar]
background       = "#281917"
background-alpha = 0.88
text             = "#e1dbdb"
active           = "#dba194"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(dba194ee) rgba(d99aabee) rgba(d9ba9aee) 45deg"
active-border-foreground = "#dba194"

[controls]
normal-color        = "#d1c3c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c3c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#dba194"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#dba194"
focus-fill-alpha   = 0.12
focus-border       = "#dba194"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#d9ba9a"
selected-fill-alpha   = 0.18
selected-border       = "#d9ba9a"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#34201d"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#34201d"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#dba194"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#34201d"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#dba194"

[launcher]
background                = "#281917"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#dba194"
border-alpha              = 1.0
scrim                     = "#281917"
