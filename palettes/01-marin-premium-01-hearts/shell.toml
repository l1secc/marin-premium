[bar]
background       = "#28141d"
background-alpha = 0.88
text             = "#e1dbde"
active           = "#e3bbb4"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(e3bbb4ee) rgba(99c0d5ee) rgba(e997d4ee) 45deg"
active-border-foreground = "#e3bbb4"

[controls]
normal-color        = "#d1c2c9"
normal-fill-alpha   = 0.05
normal-border       = "#d1c2c9"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#e3bbb4"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#e3bbb4"
focus-fill-alpha   = 0.12
focus-border       = "#e3bbb4"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#e997d4"
selected-fill-alpha   = 0.18
selected-border       = "#e997d4"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#341926"
background-alpha = 0.92
text             = "#e1dbde"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#341926"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#e3bbb4"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#341926"
background-alpha = 0.92
text             = "#e1dbde"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
