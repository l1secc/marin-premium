[bar]
background       = "#201825"
background-alpha = 0.88
text             = "#dedbe1"
active           = "#cbb0df"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(cbb0dfee) rgba(5c88bcee) rgba(f4bb9fee) 45deg"
active-border-foreground = "#cbb0df"

[controls]
normal-color        = "#cac2d1"
normal-fill-alpha   = 0.05
normal-border       = "#cac2d1"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f2f2f3"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#cbb0df"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#cbb0df"
focus-fill-alpha   = 0.12
focus-border       = "#cbb0df"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#f4bb9f"
selected-fill-alpha   = 0.18
selected-border       = "#f4bb9f"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#291f31"
background-alpha = 0.92
text             = "#dedbe1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#291f31"
background-alpha = 0.92
text             = "#f2f2f3"
border           = "#cbb0df"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#291f31"
background-alpha = 0.92
text             = "#dedbe1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#cbb0df"

[launcher]
background                = "#201825"
background-alpha          = 0.95
text                      = "#f2f2f3"
border                    = "#cbb0df"
border-alpha              = 1.0
scrim                     = "#201825"
scrim-alpha               = 0.55
selected-background       = "#53465d"
selected-background-alpha = 0.30
selected-text             = "#f0c7cb"
selected-border           = "#cbb0df"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#201825"
background-alpha          = 0.95
text                      = "#f2f2f3"
border                    = "#cbb0df"
border-alpha              = 1.0
scrim                     = "#201825"
scrim-alpha               = 0.55
selected-background       = "#53465d"
selected-background-alpha = 0.30
selected-text             = "#f0c7cb"
selected-border           = "#cbb0df"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#201825"
background-alpha = 0.95
text             = "#dedbe1"
text-error       = "#d16c6d"
border           = "hyprland.active-border"
border-error     = "#d16c6d"
border-alpha     = 1.0
border-width     = 2
scrim            = "#201825"
scrim-alpha      = 0.5
accent           = "#cbb0df"

[lock]
background       = "#201825"
background-alpha = 0.80
text             = "#dedbe1"
placeholder      = "#8f78a1"
text-error       = "#d16c6d"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
