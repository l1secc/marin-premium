#    · surface_* keeps the photo-tinted desktop chrome (bar / menu / launcher /
#      lock) the theme ships, retinted by tools/marin_generate.py
#    · the remaining accents keep Marin's rose/gold/lilac roles, photo-pulled
# ============================================================================

