[bar]
background       = "#2b1d14"
background-alpha = 0.88
text             = "#e1dddb"
active           = "#f5bea4"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(f5bea4ee) rgba(f4aab3ee) rgba(f4daaaee) 45deg"
active-border-foreground = "#f5bea4"

[controls]
normal-color        = "#d1c8c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c8c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#f5bea4"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#f5bea4"
focus-fill-alpha   = 0.12
focus-border       = "#f5bea4"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#f4daaa"
selected-fill-alpha   = 0.18
selected-border       = "#f4daaa"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#382519"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#382519"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#f5bea4"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#382519"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#f5bea4"

[launcher]
background                = "#2b1d14"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f5bea4"
border-alpha              = 1.0
scrim                     = "#2b1d14"
scrim-alpha               = 0.55
selected-background       = "#684d3f"
selected-background-alpha = 0.30
selected-text             = "#f5c2cf"
selected-border           = "#f5bea4"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#2b1d14"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f5bea4"
border-alpha              = 1.0
scrim                     = "#2b1d14"
scrim-alpha               = 0.55
selected-background       = "#684d3f"
selected-background-alpha = 0.30
selected-text             = "#f5c2cf"
selected-border           = "#f5bea4"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#2b1d14"
background-alpha = 0.95
text             = "#e1dddb"
text-error       = "#df6479"
border           = "hyprland.active-border"
border-error     = "#df6479"
border-alpha     = 1.0
border-width     = 2
scrim            = "#2b1d14"
scrim-alpha      = 0.5
accent           = "#f5bea4"

[lock]
