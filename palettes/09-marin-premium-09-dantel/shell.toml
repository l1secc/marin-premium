[bar]
background       = "#291e16"
background-alpha = 0.88
text             = "#e1dddb"
active           = "#8be3f2"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(8be3f2ee) rgba(8fc3f3ee) rgba(d9aca2ee) 45deg"
active-border-foreground = "#8be3f2"

[controls]
normal-color        = "#d1c9c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c9c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#8be3f2"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#8be3f2"
focus-fill-alpha   = 0.12
focus-border       = "#8be3f2"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#d9aca2"
selected-fill-alpha   = 0.18
selected-border       = "#d9aca2"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#35261b"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#35261b"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#8be3f2"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#35261b"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#8be3f2"

[launcher]
background                = "#291e16"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#8be3f2"
border-alpha              = 1.0
scrim                     = "#291e16"
scrim-alpha               = 0.55
selected-background       = "#465958"
selected-background-alpha = 0.30
selected-text             = "#f3c3c9"
selected-border           = "#8be3f2"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#291e16"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#8be3f2"
border-alpha              = 1.0
scrim                     = "#291e16"
scrim-alpha               = 0.55
selected-background       = "#465958"
selected-background-alpha = 0.30
selected-text             = "#f3c3c9"
selected-border           = "#8be3f2"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#291e16"
background-alpha = 0.95
text             = "#e1dddb"
text-error       = "#db696b"
border           = "hyprland.active-border"
border-error     = "#db696b"
border-alpha     = 1.0
border-width     = 2
scrim            = "#291e16"
scrim-alpha      = 0.5
accent           = "#8be3f2"

[lock]
background       = "#291e16"
background-alpha = 0.80
text             = "#e1dddb"
placeholder      = "#a18a78"
text-error       = "#db696b"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
