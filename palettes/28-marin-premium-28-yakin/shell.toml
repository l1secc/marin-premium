[bar]
background       = "#242018"
background-alpha = 0.88
text             = "#e1dfdb"
active           = "#bd9e5e"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(bd9e5eee) rgba(bfbe61ee) rgba(bf7661ee) 45deg"
active-border-foreground = "#bd9e5e"

[controls]
normal-color        = "#d1ccc2"
normal-fill-alpha   = 0.05
normal-border       = "#d1ccc2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#bd9e5e"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#bd9e5e"
focus-fill-alpha   = 0.12
focus-border       = "#bd9e5e"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#bf7661"
selected-fill-alpha   = 0.18
selected-border       = "#bf7661"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#2f291f"
background-alpha = 0.92
text             = "#e1dfdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#2f291f"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#bd9e5e"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#2f291f"
background-alpha = 0.92
text             = "#e1dfdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#bd9e5e"

[launcher]
background                = "#242018"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#bd9e5e"
border-alpha              = 1.0
scrim                     = "#242018"
scrim-alpha               = 0.55
selected-background       = "#52462d"
selected-background-alpha = 0.30
selected-text             = "#eccace"
selected-border           = "#bd9e5e"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#242018"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#bd9e5e"
border-alpha              = 1.0
scrim                     = "#242018"
scrim-alpha               = 0.55
selected-background       = "#52462d"
selected-background-alpha = 0.30
selected-text             = "#eccace"
selected-border           = "#bd9e5e"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#242018"
background-alpha = 0.95
text             = "#e1dfdb"
text-error       = "#c77676"
border           = "hyprland.active-border"
border-error     = "#c77676"
border-alpha     = 1.0
border-width     = 2
scrim            = "#242018"
scrim-alpha      = 0.5
accent           = "#bd9e5e"

[lock]
background       = "#242018"
background-alpha = 0.80
text             = "#e1dfdb"
placeholder      = "#a19378"
text-error       = "#c77676"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#c77676"
border-alpha     = 1.0
border-width     = 2
selection        = "#bd9e5e"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#242018"
scrim-alpha             = "0.5"
text                    = "#e1dfdb"
selected-border         = "#bd9e5e"
selected-border-alpha   = 1.0
unselected-border       = "#d1ccc2"
unselected-border-alpha = 0.28