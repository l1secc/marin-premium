[bar]
background       = "#271d17"
background-alpha = 0.88
text             = "#e1dddb"
active           = "#b6e3e1"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(b6e3e1ee) rgba(b8d69aee) rgba(e7a492ee) 45deg"
active-border-foreground = "#b6e3e1"

[controls]
normal-color        = "#d1c8c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c8c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#b6e3e1"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#b6e3e1"
focus-fill-alpha   = 0.12
focus-border       = "#b6e3e1"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#e7a492"
selected-fill-alpha   = 0.18
selected-border       = "#e7a492"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#32261d"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#32261d"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#b6e3e1"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#32261d"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#b6e3e1"

[launcher]
background                = "#271d17"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#b6e3e1"
border-alpha              = 1.0
scrim                     = "#271d17"
scrim-alpha               = 0.55
selected-background       = "#525854"
selected-background-alpha = 0.30
selected-text             = "#f4c2c7"
selected-border           = "#b6e3e1"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#271d17"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#b6e3e1"
border-alpha              = 1.0
scrim                     = "#271d17"
scrim-alpha               = 0.55
selected-background       = "#525854"
selected-background-alpha = 0.30
selected-text             = "#f4c2c7"
selected-border           = "#b6e3e1"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#271d17"
background-alpha = 0.95
text             = "#e1dddb"
text-error       = "#dd6666"
border           = "hyprland.active-border"
border-error     = "#dd6666"
border-alpha     = 1.0
border-width     = 2
scrim            = "#271d17"
scrim-alpha      = 0.5
accent           = "#b6e3e1"

[lock]
background       = "#271d17"
background-alpha = 0.80
text             = "#e1dddb"
placeholder      = "#a18978"
text-error       = "#dd6666"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#dd6666"
border-alpha     = 1.0
border-width     = 2
selection        = "#b6e3e1"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#271d17"
scrim-alpha             = "0.5"
text                    = "#e1dddb"
selected-border         = "#b6e3e1"
selected-border-alpha   = 1.0
unselected-border       = "#d1c8c2"
unselected-border-alpha = 0.28