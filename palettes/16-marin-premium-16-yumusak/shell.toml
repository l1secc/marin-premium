[bar]
background       = "#281815"
background-alpha = 0.88
text             = "#e1dbdb"
active           = "#f4b499"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(f4b499ee) rgba(be6190ee) rgba(f4d49dee) 45deg"
active-border-foreground = "#f4b499"

[controls]
normal-color        = "#d1c4c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c4c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#f4b499"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#f4b499"
focus-fill-alpha   = 0.12
focus-border       = "#f4b499"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#f4d49d"
selected-fill-alpha   = 0.18
selected-border       = "#f4d49d"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#341f1b"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#341f1b"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#f4b499"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#341f1b"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
