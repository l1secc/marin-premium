[bar]
background       = "#231a17"
background-alpha = 0.88
text             = "#e1dcdb"
active           = "#d6a89b"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(d6a89bee) rgba(99b5d5ee) rgba(d7bd9eee) 45deg"
active-border-foreground = "#d6a89b"

[controls]
normal-color        = "#d1c5c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c5c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#d6a89b"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#d6a89b"
focus-fill-alpha   = 0.12
focus-border       = "#d6a89b"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#d7bd9e"
selected-fill-alpha   = 0.18
selected-border       = "#d7bd9e"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#2e211e"
background-alpha = 0.92
text             = "#e1dcdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#2e211e"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#d6a89b"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#2e211e"
background-alpha = 0.92
text             = "#e1dcdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#d6a89b"

[launcher]
background                = "#231a17"
background-alpha          = 0.95
