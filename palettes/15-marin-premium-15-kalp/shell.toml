[bar]
background       = "#2a1814"
background-alpha = 0.88
text             = "#e1dcdb"
active           = "#f4989e"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(f4989eee) rgba(f3c591ee) rgba(f4b39cee) 45deg"
active-border-foreground = "#f4989e"

[controls]
normal-color        = "#d1c5c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c5c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#f4989e"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#f4989e"
focus-fill-alpha   = 0.12
focus-border       = "#f4989e"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#f4b39c"
selected-fill-alpha   = 0.18
selected-border       = "#f4b39c"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#371f19"
background-alpha = 0.92
text             = "#e1dcdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#371f19"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#f4989e"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#371f19"
background-alpha = 0.92
text             = "#e1dcdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#f4989e"

[launcher]
background                = "#2a1814"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f4989e"
border-alpha              = 1.0
scrim                     = "#2a1814"
scrim-alpha               = 0.55
selected-background       = "#673e3d"
selected-background-alpha = 0.30
selected-text             = "#f5c2d4"
selected-border           = "#f4989e"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#2a1814"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f4989e"
border-alpha              = 1.0
scrim                     = "#2a1814"
scrim-alpha               = 0.55
selected-background       = "#673e3d"
selected-background-alpha = 0.30
selected-text             = "#f5c2d4"
selected-border           = "#f4989e"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#2a1814"
background-alpha = 0.95
text             = "#e1dcdb"
text-error       = "#de5e80"
border           = "hyprland.active-border"
border-error     = "#de5e80"
border-alpha     = 1.0
border-width     = 2
