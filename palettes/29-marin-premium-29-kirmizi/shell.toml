[bar]
background       = "#261918"
background-alpha = 0.88
text             = "#e1dbdb"
active           = "#dba093"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(dba093ee) rgba(a6bfdbee) rgba(9272c5ee) 45deg"
active-border-foreground = "#dba093"

[controls]
normal-color        = "#d1c3c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c3c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#dba093"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#dba093"
focus-fill-alpha   = 0.12
focus-border       = "#dba093"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#9272c5"
selected-fill-alpha   = 0.18
selected-border       = "#9272c5"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#321f1e"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#321f1e"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#dba093"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#321f1e"
background-alpha = 0.92
text             = "#e1dbdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#dba093"

[launcher]
background                = "#261918"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#dba093"
border-alpha              = 1.0
scrim                     = "#261918"
