[bar]
background       = "#251b18"
background-alpha = 0.88
text             = "#e1dcdb"
active           = "#f2e2a9"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(f2e2a9ee) rgba(a0cfe4ee) rgba(c58171ee) 45deg"
active-border-foreground = "#f2e2a9"

[controls]
normal-color        = "#d1c6c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c6c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#f2e2a9"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#f2e2a9"
focus-fill-alpha   = 0.12
focus-border       = "#f2e2a9"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#c58171"
selected-fill-alpha   = 0.18
selected-border       = "#c58171"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#31231f"
background-alpha = 0.92
text             = "#e1dcdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#31231f"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#f2e2a9"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#31231f"
background-alpha = 0.92
text             = "#e1dcdb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#f2e2a9"

[launcher]
background                = "#251b18"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f2e2a9"
border-alpha              = 1.0
scrim                     = "#251b18"
scrim-alpha               = 0.55
selected-background       = "#625744"
selected-background-alpha = 0.30
selected-text             = "#f2c4ca"
selected-border           = "#f2e2a9"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#251b18"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f2e2a9"
border-alpha              = 1.0
scrim                     = "#251b18"
scrim-alpha               = 0.55
selected-background       = "#625744"
selected-background-alpha = 0.30
selected-text             = "#f2c4ca"
selected-border           = "#f2e2a9"
selected-border-alpha     = 0.94
