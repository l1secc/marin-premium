[bar]
background       = "#251d18"
background-alpha = 0.88
text             = "#e1dddb"
active           = "#e4d1b8"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(e4d1b8ee) rgba(b7d5e2ee) rgba(e4e0bcee) 45deg"
active-border-foreground = "#e4d1b8"

[controls]
normal-color        = "#d1c7c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c7c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#e4d1b8"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#e4d1b8"
focus-fill-alpha   = 0.12
focus-border       = "#e4d1b8"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#e4e0bc"
selected-fill-alpha   = 0.18
selected-border       = "#e4e0bc"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#31251e"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#31251e"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#e4d1b8"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#31251e"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#e4d1b8"

[launcher]
background                = "#251d18"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#e4d1b8"
border-alpha              = 1.0
