[bar]
background       = "#2b1d15"
background-alpha = 0.88
text             = "#e1dddb"
active           = "#f3c693"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(f3c693ee) rgba(f49dacee) rgba(f4e798ee) 45deg"
active-border-foreground = "#f3c693"

[controls]
normal-color        = "#d1c8c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c8c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#f3c693"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#f3c693"
focus-fill-alpha   = 0.12
focus-border       = "#f3c693"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#f4e798"
selected-fill-alpha   = 0.18
selected-border       = "#f4e798"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#37251a"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#37251a"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#f3c693"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#37251a"
background-alpha = 0.92
text             = "#e1dddb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#f3c693"

[launcher]
background                = "#2b1d15"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f3c693"
border-alpha              = 1.0
scrim                     = "#2b1d15"
scrim-alpha               = 0.55
selected-background       = "#67503b"
selected-background-alpha = 0.30
selected-text             = "#f5c2d1"
selected-border           = "#f3c693"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#2b1d15"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f3c693"
border-alpha              = 1.0
scrim                     = "#2b1d15"
scrim-alpha               = 0.55
selected-background       = "#67503b"
selected-background-alpha = 0.30
selected-text             = "#f5c2d1"
selected-border           = "#f3c693"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#2b1d15"
background-alpha = 0.95
text             = "#e1dddb"
text-error       = "#de657d"
border           = "hyprland.active-border"
border-error     = "#de657d"
border-alpha     = 1.0
border-width     = 2
scrim            = "#2b1d15"
scrim-alpha      = 0.5
accent           = "#f3c693"

[lock]
background       = "#2b1d15"
background-alpha = 0.80
text             = "#e1dddb"
placeholder      = "#a18778"
text-error       = "#de657d"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#de657d"
border-alpha     = 1.0
border-width     = 2
selection        = "#f3c693"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#2b1d15"
scrim-alpha             = "0.5"
text                    = "#e1dddb"
selected-border         = "#f3c693"
selected-border-alpha   = 1.0
unselected-border       = "#d1c8c2"
unselected-border-alpha = 0.28