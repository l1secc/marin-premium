[bar]
background       = "#2b1f15"
background-alpha = 0.88
text             = "#e1dedb"
active           = "#f4dca7"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(f4dca7ee) rgba(f0f2aeee) rgba(f2bfaeee) 45deg"
active-border-foreground = "#f4dca7"

[controls]
normal-color        = "#d1c9c2"
normal-fill-alpha   = 0.05
normal-border       = "#d1c9c2"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f3f2f2"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#f4dca7"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#f4dca7"
focus-fill-alpha   = 0.12
focus-border       = "#f4dca7"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#f2bfae"
selected-fill-alpha   = 0.18
selected-border       = "#f2bfae"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#38281a"
background-alpha = 0.92
text             = "#e1dedb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#38281a"
background-alpha = 0.92
text             = "#f3f2f2"
border           = "#f4dca7"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#38281a"
background-alpha = 0.92
text             = "#e1dedb"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#f4dca7"

[launcher]
background                = "#2b1f15"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f4dca7"
border-alpha              = 1.0
scrim                     = "#2b1f15"
scrim-alpha               = 0.55
selected-background       = "#675841"
selected-background-alpha = 0.30
selected-text             = "#f3c4c8"
selected-border           = "#f4dca7"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#2b1f15"
background-alpha          = 0.95
text                      = "#f3f2f2"
border                    = "#f4dca7"
border-alpha              = 1.0
scrim                     = "#2b1f15"
scrim-alpha               = 0.55
selected-background       = "#675841"
selected-background-alpha = 0.30
selected-text             = "#f3c4c8"
selected-border           = "#f4dca7"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#2b1f15"
background-alpha = 0.95
text             = "#e1dedb"
text-error       = "#da6b6a"
border           = "hyprland.active-border"
border-error     = "#da6b6a"
border-alpha     = 1.0
border-width     = 2
scrim            = "#2b1f15"
scrim-alpha      = 0.5
accent           = "#f4dca7"

[lock]
background       = "#2b1f15"
background-alpha = 0.80
text             = "#e1dedb"
placeholder      = "#a18b78"
text-error       = "#da6b6a"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#da6b6a"
border-alpha     = 1.0
border-width     = 2
selection        = "#f4dca7"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#2b1f15"
scrim-alpha             = "0.5"
text                    = "#e1dedb"
selected-border         = "#f4dca7"
selected-border-alpha   = 1.0
unselected-border       = "#d1c9c2"
unselected-border-alpha = 0.28