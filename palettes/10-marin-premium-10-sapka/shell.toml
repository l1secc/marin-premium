[bar]
background       = "#171e27"
background-alpha = 0.88
text             = "#dbdee1"
active           = "#aed4ed"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(aed4edee) rgba(b4c3ebee) rgba(dcbdaaee) 45deg"
active-border-foreground = "#aed4ed"

[controls]
normal-color        = "#c2c9d1"
normal-fill-alpha   = 0.05
normal-border       = "#c2c9d1"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f2f2f3"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#aed4ed"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#aed4ed"
focus-fill-alpha   = 0.12
focus-border       = "#aed4ed"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#dcbdaa"
selected-fill-alpha   = 0.18
selected-border       = "#dcbdaa"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#1d2733"
background-alpha = 0.92
text             = "#dbdee1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#1d2733"
background-alpha = 0.92
text             = "#f2f2f3"
border           = "#aed4ed"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#1d2733"
background-alpha = 0.92
text             = "#dbdee1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
