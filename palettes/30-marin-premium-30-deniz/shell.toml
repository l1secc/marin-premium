[bar]
background       = "#161c27"
background-alpha = 0.88
text             = "#dbdde1"
active           = "#b4d1e7"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
# Same 3-stop gradient as the active window border — visual unity
active-border            = "rgba(b4d1e7ee) rgba(dba8b7ee) rgba(e4bfa2ee) 45deg"
active-border-foreground = "#b4d1e7"

[controls]
normal-color        = "#c2c7d1"
normal-fill-alpha   = 0.05
normal-border       = "#c2c7d1"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#f2f2f3"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#b4d1e7"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#b4d1e7"
focus-fill-alpha   = 0.12
focus-border       = "#b4d1e7"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color        = "#e4bfa2"
selected-fill-alpha   = 0.18
selected-border       = "#e4bfa2"
selected-border-width = 1
selected-border-alpha = 0.60

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale            = 1.0
scale-with-font  = true

[font]
base-size = 12

[popups]
background       = "#1c2433"
background-alpha = 0.92
text             = "#dbdde1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#1c2433"
background-alpha = 0.92
text             = "#f2f2f3"
border           = "#b4d1e7"
border-alpha     = 1.0
border-width     = 1

[notifications]
background       = "#1c2433"
background-alpha = 0.92
text             = "#dbdde1"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#b4d1e7"

[launcher]
background                = "#161c27"
background-alpha          = 0.95
text                      = "#f2f2f3"
border                    = "#b4d1e7"
border-alpha              = 1.0
scrim                     = "#161c27"
scrim-alpha               = 0.55
selected-background       = "#455261"
selected-background-alpha = 0.30
selected-text             = "#f3c3d4"
selected-border           = "#b4d1e7"
selected-border-alpha     = 0.94
selected-border-width     = 1

[menu]
background                = "#161c27"
background-alpha          = 0.95
text                      = "#f2f2f3"
border                    = "#b4d1e7"
border-alpha              = 1.0
scrim                     = "#161c27"
scrim-alpha               = 0.55
selected-background       = "#455261"
selected-background-alpha = 0.30
selected-text             = "#f3c3d4"
selected-border           = "#b4d1e7"
selected-border-alpha     = 0.94
selected-border-width     = 1

[polkit]
background       = "#161c27"
background-alpha = 0.95
text             = "#dbdde1"
text-error       = "#d96381"
border           = "hyprland.active-border"
border-error     = "#d96381"
border-alpha     = 1.0
border-width     = 2
scrim            = "#161c27"
scrim-alpha      = 0.5
accent           = "#b4d1e7"

[lock]
background       = "#161c27"
background-alpha = 0.80
text             = "#dbdde1"
placeholder      = "#7885a1"
