# ============================================================================
#  Marin Kitagawa — "Marin Premium"  ·  Ghostty terminal
#  16-color ANSI matrix tuned for syntax-highlighting readability.
#  All hues desaturated ~10–15% vs. Marin's raw anime palette to soften
#  long-session eye strain.
# ============================================================================

background           = #0f1522
foreground           = #d9dfee
cursor-color         = #eef2fb
cursor-text          = #0f1522
selection-background = #2b3754
selection-foreground = #eef2fb

# ANSI 0–15  ·  Marin-palette matrix
palette = [#0f1522, #e06c8a, #a3cdb0, #e8c98f, #8fb2e8, #f2a3c0, #9ad0d8, #d9dfee,
          #5a6580, #f0a5b8, #c4e1ce, #f2d8a8, #b6c8f0, #f7c2d9, #bde4e6, #eef2fb]

# Soft, paper-thin cursor that does not fatigue on long sessions
cursor-style = steady
cursor-opacity = 0.85